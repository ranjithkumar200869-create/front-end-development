<!DOCTYPE html>
<html>
<head>
    <title>Font Awesome Icons Example</title>

    <!-- Font Awesome CDN -->
    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

    <h2>Font Awesome Icons Demo</h2>

    <p><i class="fa-solid fa-house"></i> Home</p>

    <p><i class="fa-solid fa-user"></i> User</p>

    <p><i class="fa-solid fa-envelope"></i> Email</p>

    <p><i class="fa-solid fa-phone"></i> Phone</p>

    <p><i class="fa-solid fa-magnifying-glass"></i> Search</p>

    <p><i class="fa-solid fa-cart-shopping"></i> Shopping Cart</p>

    <h3>Social Media Icons</h3>

    <i class="fa-brands fa-facebook"></i>
    <i class="fa-brands fa-instagram"></i>
    <i class="fa-brands fa-twitter"></i>
    <i class="fa-brands fa-linkedin"></i>

</body>
</html>
