<!DOCTYPE html>
<html>
<head>
    <title>Login Page</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f2f2;
        }

        .login-container {
            width: 300px;
            margin: 100px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0px 0px 10px 0px #aaa;
        }

        h2 {
            text-align: center;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            width: 100%;
            padding: 10px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background-color: #2980b9;
        }

        .extra {
            text-align: center;
            margin-top: 10px;
        }

        a {
            text-decoration: none;
            color: #3498db;
        }
    </style>
</head>

<body>

<div class="login-container">
    <h2>Login</h2>
    
    <form>
        <input type="text" placeholder="Username" required>
        <input type="password" placeholder="Password" required>
        
        <button type="submit">Login</button>
    </form>

    <div class="extra">
        <p><a href="#">Forgot Password?</a></p>
    </div>
</div>

</body>
</html>
