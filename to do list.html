<!DOCTYPE html>
<html>
<head>
    <title>To-Do List</title>
    <style>
        body {
            font-family: Arial;
            background-color: #f4f4f4;
            text-align: center;
        }

        .container {
            background: white;
            width: 300px;
            margin: 50px auto;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 0 10px gray;
        }

        input {
            width: 70%;
            padding: 8px;
        }

        button {
            padding: 8px 10px;
            margin-top: 10px;
            cursor: pointer;
        }

        ul {
            list-style: none;
            padding: 0;
        }

        li {
            background: #e3e3e3;
            margin: 5px 0;
            padding: 8px;
            display: flex;
            justify-content: space-between;
            border-radius: 5px;
        }

        .delete {
            background: red;
            color: white;
            border: none;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>To-Do List</h2>
    
    <input type="text" id="taskInput" placeholder="Enter task">
    <br>
    <button onclick="addTask()">Add Task</button>

    <ul id="taskList"></ul>
</div>

<script>
    function addTask() {
        let input = document.getElementById("taskInput");
        let task = input.value;

        if (task === "") {
            alert("Please enter a task");
            return;
        }

        let li = document.createElement("li");
        li.textContent = task;

        let delBtn = document.createElement("button");
        delBtn.textContent = "X";
        delBtn.className = "delete";

        delBtn.onclick = function () {
            li.remove();
        };

        li.appendChild(delBtn);
        document.getElementById("taskList").appendChild(li);

        input.value = "";
    }
</script>

</body>
</html>
